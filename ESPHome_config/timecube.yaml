# Tracking-Erinnerung & Zeitlimit (persistiert ueber Reboot)
number:
  # Kurzes Aufblinken alle X Minuten, solange getrackt wird (0 = aus)
  - platform: template
    name: "Erinnerung alle Minuten (0 = aus)"
    web_server:
      sorting_group_id: grp_tracking
      sorting_weight: 1
    id: reminder_minutes
    min_value: 0
    max_value: 240
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 30

  # Fallback: nach X Stunden auf derselben Seite wird das Tracking automatisch beendet
  - platform: template
    name: "Max. Tracking Stunden (Min 1, Max 24)"
    web_server:
      sorting_group_id: grp_tracking
      sorting_weight: 2
    id: max_tracking_hours
    min_value: 1
    max_value: 24
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 4

  # Helligkeit der blauen WLAN-Anzeige
  - platform: template
    name: "WLAN LED Helligkeit"
    web_server:
      sorting_group_id: grp_wlan
      sorting_weight: 1
    id: wifi_led_brightness
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 30

  # Seite muss so lange stabil liegen, bevor ein Wechsel bestaetigt wird
  - platform: template
    name: "Entprellzeit"
    web_server:
      sorting_group_id: grp_tracking
      sorting_weight: 3
    id: debounce_seconds
    min_value: 0.2
    max_value: 10
    step: 0.1
    unit_of_measurement: "s"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 1

  # Nach einem Doppelklick: so lange darf der Wuerfel abgelegt werden, ohne die Pause zu beenden
  - platform: template
    name: "Pause Karenzzeit"
    web_server:
      sorting_group_id: grp_pause
      sorting_weight: 1
    id: break_grace_seconds
    min_value: 1
    max_value: 120
    step: 1
    unit_of_measurement: "s"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 15

  # LED-Farbe fuer Pause (Blinken + Pulsieren)
  - platform: template
    name: "Pause LED Rot"
    web_server:
      sorting_group_id: grp_pause
      sorting_weight: 2
    id: break_red
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 0

  - platform: template
    name: "Pause LED Gruen"
    web_server:
      sorting_group_id: grp_pause
      sorting_weight: 3
    id: break_green
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 100

  - platform: template
    name: "Pause LED Blau"
    web_server:
      sorting_group_id: grp_pause
      sorting_weight: 4
    id: break_blue
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 80

  # Maximale Helligkeit des Pausen-Pulsierens (Minimum = 1/6 davon)
  - platform: template
    name: "Pause LED Helligkeit"
    web_server:
      sorting_group_id: grp_pause
      sorting_weight: 5
    id: break_led_brightness
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 18

# Global Variables
globals:
  - id: last_side
    type: int
    restore_value: no
    initial_value: '-1'  # -1 = noch nichts, 0 = Pause, 1-6 = Seite

  - id: pending_side
    type: int
    restore_value: no
    initial_value: '0'

  - id: debounce_start
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: activity_start
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: activity_start_epoch
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: is_debouncing
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: wifi_connected
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: wifi_ever_connected
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: wifi_user_enabled
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: green_flash_until
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: led_override_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: reminder_count
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: tracking_stopped
    type: bool
    restore_value: no
    initial_value: 'false'

  # Seite, die waehrend der Pause ignoriert wird: beim Doppelklick die aktuelle Seite,
  # danach die Seite, auf der der Wuerfel innerhalb der Karenzzeit abgelegt wurde
  - id: break_hold_side
    type: int
    restore_value: no
    initial_value: '0'

  # Start der Doppelklick-Pause (fuer die Karenzzeit break_grace_seconds)
  - id: break_lock_start
    type: unsigned long
    restore_value: no
    initial_value: '0'


# Scripts
script:
  - id: handle_side_change
    then:
      - lambda: |-
          int new_side = (int)id(current_side).state;

          // Pause per Doppelklick: Wuerfel liegt noch auf der alten Seite -> ignorieren
          if (id(break_hold_side) > 0) {
            if (new_side == id(break_hold_side)) {
              id(is_debouncing) = false;
              return;
            }
            if (new_side == 0) id(break_hold_side) = 0;  // jetzt physisch auf der Ecke
          }

          // Kein Unterschied zur aktuell bestätigten Seite -> nichts zu tun
          if (new_side == id(last_side)) return;

          // Nur Timer (neu) starten, wenn wir noch nicht schon auf genau diese Seite debouncen
          if (!id(is_debouncing) || new_side != id(pending_side)) {
            id(pending_side) = new_side;
            id(debounce_start) = millis();
            id(is_debouncing) = true;
            ESP_LOGI("timecube", "Debounce started: %d -> %d", id(last_side), new_side);
          }

  # Wird alle 500ms vom interval aufgerufen, prüft ob Debounce abgelaufen ist
  - id: check_debounce
    then:
      - lambda: |-
          if (!id(is_debouncing)) return;

          int current = (int)id(current_side).state;

          // Seite hat sich während der Debounce-Zeit nochmal geändert
          if (current != id(pending_side)) {
            id(pending_side) = current;
            id(debounce_start) = millis();
            return;
          }

          // Lange genug stabil? -> bestaetigen
          if (millis() - id(debounce_start) > (uint32_t)(id(debounce_seconds).state * 1000.0f)) {
            id(is_debouncing) = false;

            // Kurz nach Doppelklick: Wuerfel wird in der Pause abgelegt,
            // die neue Seite gehoert zur Pause (erst ein spaeterer Flip/Klick beendet sie)
            if (id(last_side) == 0 && id(break_lock_start) > 0 &&
                millis() - id(break_lock_start) < (uint32_t)(id(break_grace_seconds).state * 1000.0f)) {
              id(break_hold_side) = current;
              id(led_blink).execute(id(break_red).state / 100.0f, id(break_green).state / 100.0f, id(break_blue).state / 100.0f);  // Pause bleibt
              ESP_LOGI("timecube", "Pause: Wuerfel auf Seite %d abgelegt", current);
              return;
            }

            if (id(break_hold_side) > 0 && current == id(break_hold_side)) return;
            id(break_hold_side) = 0;
            id(switch_to_side).execute(current);
          }

  # Laufende Sitzung loggen und neue starten (0 = Pause, 1-6 = Seite)
  - id: switch_to_side
    parameters:
      side: int
    then:
      - lambda: |-
          if (id(activity_start) > 0) {
            unsigned long duration = (millis() - id(activity_start)) / 1000;
            id(activity_duration).publish_state(duration);
            log_activity(id(last_side), duration);
            id(csv_export).update();
            id(log_count).update();
          }

          id(last_side) = side;
          id(activity_start) = millis();
          auto now = id(sntp_time).now();
          id(activity_start_epoch) = now.is_valid() ? (unsigned long)now.timestamp : 0;
          id(reminder_count) = 0;
          id(tracking_stopped) = false;
          id(current_activity).update();

          if (side > 0) {
            id(green_flash_until) = millis() + 5000;
          } else {
            id(green_flash_until) = 0;
            id(led_blink).execute(id(break_red).state / 100.0f, id(break_green).state / 100.0f, id(break_blue).state / 100.0f);  // Pause beginnt
          }

          ESP_LOGI("timecube", "Side confirmed: %d (%s)", side, id(current_activity).state.c_str());

  - id: update_led
    then:
      - lambda: |-
          ESP_LOGD("timecube", "update_led: wifi=%d debounce=%d green_until=%lu now=%lu",
           id(wifi_connected), id(is_debouncing), id(green_flash_until), millis());

          if (id(led_override_active)) return;  // Reminder-Blinken läuft, nicht stören

          // WiFi per Taster abgeschaltet -> LED aus
          if (!id(wifi_user_enabled)) {
            id(status_led).turn_off().perform();
            return;
          }

          // WiFi nicht verbunden
          if (!id(wifi_connected)) {
            unsigned long period = id(wifi_ever_connected) ? 300 : 1000; // rot schnell / gelb langsam
            bool on_phase = (millis() % period) < (period / 2);
            auto call = id(status_led).turn_on();
            if (on_phase) {
              if (id(wifi_ever_connected)) call.set_rgb(1.0f, 0.0f, 0.0f);   // Rot
              else call.set_rgb(1.0f, 0.75f, 0.0f);                          // Gelb
              call.set_brightness(1.0f);
            } else {
              call.set_state(false);
            }
            call.perform();
            return;
          }

          // Seitenwechsel erkannt -> Grün, 5s an
          if (millis() < id(green_flash_until)) {
            auto call = id(status_led).turn_on();
            call.set_rgb(0.0f, 1.0f, 0.0f);
            call.set_brightness(1.0f);
            call.perform();
            return;
          }

          // Debounce läuft -> Weiß gedimmt
          if (id(is_debouncing)) {
            auto call = id(status_led).turn_on();
            call.set_rgb(1.0f, 1.0f, 1.0f);
            call.set_brightness(0.15f);
            call.perform();
            return;
          }

          // Tracking per Zeitlimit beendet -> gedimmtes Lila, bis gekippt wird
          if (id(tracking_stopped)) {
            auto call = id(status_led).turn_on();
            call.set_rgb(0.6f, 0.0f, 1.0f);
            call.set_brightness(0.15f);
            call.perform();
            return;
          }

          // Pause -> langsames, sanftes Tuerkis-Pulsieren
          if (id(last_side) == 0 && id(activity_start) > 0) {
            float phase = (millis() % 4000) / 4000.0f;
            float tri = phase < 0.5f ? phase * 2.0f : (1.0f - phase) * 2.0f;
            auto call = id(status_led).turn_on();
            float peak = id(break_led_brightness).state / 100.0f;
            call.set_rgb(id(break_red).state / 100.0f, id(break_green).state / 100.0f, id(break_blue).state / 100.0f);
            call.set_brightness(peak / 6.0f + (peak - peak / 6.0f) * tri);
            call.perform();
            return;
          }

          // Bereit, WiFi aktiv -> gedimmtes Blau
          auto call = id(status_led).turn_on();
          call.set_rgb(0.0f, 0.3f, 1.0f);
          call.set_brightness(id(wifi_led_brightness).state / 100.0f);
          call.perform();

  # Kurzes Aufblitzen in gegebener Farbe, ohne die normale LED-Logik zu stoeren
  - id: led_blink
    parameters:
      red: float
      green: float
      blue: float
    then:
      - lambda: 'id(led_override_active) = true;'
      - light.turn_on:
          id: status_led
          red: !lambda 'return red;'
          green: !lambda 'return green;'
          blue: !lambda 'return blue;'
          brightness: 100%
      - delay: 300ms
      - light.turn_off: status_led
      - lambda: 'id(led_override_active) = false;'

  # Alle 1s: freundliche Erinnerung, dass getrackt wird, und Zeitlimit als Fallback
  # (z.B. Wuerfel abends vergessen -> trackt nicht die ganze Nacht).
  - id: check_tracking
    then:
      - lambda: |-
          if (id(activity_start) == 0) return;  // nichts aktiv

          unsigned long elapsed = (millis() - id(activity_start)) / 1000;

          unsigned long max_sec = (unsigned long)(id(max_tracking_hours).state * 3600);
          if (elapsed >= max_sec) {
            id(activity_duration).publish_state(max_sec);
            log_activity(id(last_side), max_sec);
            id(csv_export).update();
            id(log_count).update();
            clear_checkpoint();
            id(activity_start) = 0;
            id(activity_start_epoch) = 0;
            id(tracking_stopped) = true;
            id(current_activity).publish_state("Gestoppt (Zeitlimit)");
            ESP_LOGW("timecube", "Zeitlimit erreicht: Seite %d nach %lu s automatisch beendet", id(last_side), max_sec);
            return;
          }

          unsigned long reminder_sec = (unsigned long)(id(reminder_minutes).state * 60);
          if (reminder_sec == 0) return;
          unsigned long due = elapsed / reminder_sec;
          if (due > id(reminder_count)) {
            id(reminder_count) = due;
            id(led_blink).execute(1.0f, 0.5f, 0.0f);  // Orange
          }

  - id: save_checkpoint_tick
    then:
      - lambda: |-
          if (id(activity_start) > 0 && id(last_side) >= 0 && id(last_side) <= 6) {
            save_checkpoint(id(last_side), id(activity_start_epoch));
          }

# Intervals
interval:
  - interval: 100ms
    then:
      - script.execute: update_led

  - interval: 500ms
    then:
      - script.execute: check_debounce

  - interval: 1s
    then:
      - script.execute: check_tracking

  - interval: 60s
    then:
      - script.execute: save_checkpoint_tick
