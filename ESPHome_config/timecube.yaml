esphome:
  name: timecube
  friendly_name: Time Cube
  
  includes:
    - timecube_storage.h
    - timecube_dashboard.h

  on_boot:
   - priority: -100
     then:
       - lambda: |-
          ESP_LOGI("timecube", "Time Cube gestartet!");
          setup_littlefs();
          load_config();
          register_dashboard_handler();
          id(wifi_user_enabled) = true;
       - wifi.enable:

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  partitions: partitions_timecube.csv

# ... (Rest bleibt EXAKT GLEICH wie vorher!)

# WiFi Configuration (keine hardcoded Credentials!)
wifi:
  ap:
    ssid: "TimeCube Setup"
    password: ""
  on_connect:
    then:
      - lambda: |-
          id(wifi_connected) = true;
          id(wifi_ever_connected) = true;
  on_disconnect:
    then:
      - lambda: |-
          id(wifi_connected) = false;

# Captive Portal für WiFi Setup
captive_portal:

# Improv Serial für USB-Setup über Browser
improv_serial:

# Enable logging
logger:
  level: INFO # DEBUG
  logs:
    mpu6050: INFO
    sensor: INFO
    web_server: INFO


api:
  services:
    # Namen ändern
    - service: set_activity_name
      variables:
        side: int
        name: string
      then:
        - lambda: |-
            set_activity_name(side, name);
            id(activity_side_1).update();
            id(activity_side_2).update();
            id(activity_side_3).update();
            id(activity_side_4).update();
            id(activity_side_5).update();
            id(activity_side_6).update();
    
    # CSV Export triggern
    - service: export_csv
      then:
        - lambda: |-
            id(csv_export).update();
    
    # Log löschen
    - service: clear_log
      then:
        - lambda: |-
            clear_log();
            id(csv_export).update();
            id(log_count).update();
# Web Server for Dashboard + WiFi Management
web_server_base:
  id: base_web_server

web_server:
  web_server_base_id: base_web_server
  port: 80
  version: 3
  local: true

# Time Component (NTP)
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    on_time_sync:
      then:
        - lambda: |-
            recover_checkpoint();

# I2C Bus for MPU-6050
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 100kHz
  
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    pin:
      number: 48
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    name: "Status LED"
    default_transition_length: 0s


# MPU-6050 Sensor
sensor:
  - platform: mpu6050
    address: 0x68
    update_interval: 200ms
    accel_x:
      name: "Accel X"
      id: accel_x
      internal: true
    accel_y:
      name: "Accel Y"
      id: accel_y
      internal: true
    accel_z:
      name: "Accel Z"
      id: accel_z
      internal: true

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: template
    name: "Current Side"
    id: current_side
    update_interval: 3s
    lambda: |-
      float x = id(accel_x).state;
      float y = id(accel_y).state;
      float z = id(accel_z).state;
      
      if (z > 8.0) return 1;
      if (z < -8.0) return 2;
      if (y > 8.0) return 3;
      if (y < -8.0) return 4;
      if (x > 8.0) return 5;
      if (x < -8.0) return 6;
      
      return id(current_side).state;
    on_value:
      then:
        - script.execute: handle_side_change

  - platform: template
    name: "Activity Duration"
    id: activity_duration
    unit_of_measurement: "s"
    accuracy_decimals: 0
  
  # ← HIER FEHLT LOG COUNT!
  - platform: template
    name: "Log Count"
    id: log_count
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      return get_log_count();

# Text Sensor for Activity Name
text_sensor:
  - platform: template
    name: "Current Activity"
    id: current_activity
    update_interval: never
    lambda: |-
      int side = (int)id(current_side).state;
      return get_activity_name(side);
  
  # CSV Export
  - platform: template
    name: "CSV Export"
    id: csv_export
    update_interval: never
    lambda: |-
      return get_csv_content();
  
  # Seitennamen als Text Sensors
  - platform: template
    name: "Activity Side 1"
    id: activity_side_1
    internal: true
    update_interval: 60s
    lambda: |-
      return get_activity_name(1);
  
  - platform: template
    name: "Activity Side 2"
    id: activity_side_2
    internal: true
    update_interval: 60s
    lambda: |-
      return get_activity_name(2);
  
  - platform: template
    name: "Activity Side 3"
    id: activity_side_3
    internal: true
    update_interval: 60s
    lambda: |-
      return get_activity_name(3);
  
  - platform: template
    name: "Activity Side 4"
    id: activity_side_4
    internal: true
    update_interval: 60s
    lambda: |-
      return get_activity_name(4);
  
  - platform: template
    name: "Activity Side 5"
    id: activity_side_5
    internal: true
    update_interval: 60s
    lambda: |-
      return get_activity_name(5);
  
  - platform: template
    name: "Activity Side 6"
    id: activity_side_6
    internal: true
    update_interval: 60s
    lambda: |-
      return get_activity_name(6);
      

# Binary Sensor for WiFi Status
binary_sensor:
  - platform: status
    name: "Status"

  # Taster gegen GND: 3s halten schaltet WLAN um
  - platform: gpio
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Taster"
    id: main_button
    filters:
      - delayed_on_off: 20ms
    on_state:
      - logger.log:
          level: INFO
          format: "Taster Zustand: %s"
          args: ['x ? "gedrueckt" : "losgelassen"']
    # Halten (>= 3s) schaltet WLAN um
    on_click:
      - min_length: 3000ms
        max_length: 60s
        then:
          - logger.log:
              level: INFO
              format: "Taster: Halten erkannt, WLAN umschalten"
          - lambda: 'id(wifi_user_enabled) = !id(wifi_user_enabled);'
          - if:
              condition:
                lambda: 'return id(wifi_user_enabled);'
              then:
                - wifi.enable:
              else:
                - wifi.disable:

# Button to Reset WiFi
button:
  - platform: restart
    name: "Restart"
  
  - platform: factory_reset
    name: "WiFi Reset (Factory Reset)"
    id: wifi_reset_button

  - platform: template
    name: "CSV Aktualisieren"
    on_press:
      then:
        - lambda: |-
            id(csv_export).update();
            id(log_count).update();

  - platform: template
    name: "Log Loeschen"
    on_press:
      then:
        - lambda: |-
            clear_log();
            id(csv_export).update();
            id(log_count).update();

# Editierbare Textfelder fuer Aktivitaetsnamen (sichtbar im Web-UI)
text:
  - platform: template
    name: "Seite 1 Name"
    id: name_input_1
    mode: text
    lambda: return {activity_names[1]};
    set_action:
      lambda: |-
        set_activity_name(1, x);
        id(activity_side_1).update();
        id(current_activity).update();

  - platform: template
    name: "Seite 2 Name"
    id: name_input_2
    mode: text
    lambda: return {activity_names[2]};
    set_action:
      lambda: |-
        set_activity_name(2, x);
        id(activity_side_2).update();
        id(current_activity).update();

  - platform: template
    name: "Seite 3 Name"
    id: name_input_3
    mode: text
    lambda: return {activity_names[3]};
    set_action:
      lambda: |-
        set_activity_name(3, x);
        id(activity_side_3).update();
        id(current_activity).update();

  - platform: template
    name: "Seite 4 Name"
    id: name_input_4
    mode: text
    lambda: return {activity_names[4]};
    set_action:
      lambda: |-
        set_activity_name(4, x);
        id(activity_side_4).update();
        id(current_activity).update();

  - platform: template
    name: "Seite 5 Name"
    id: name_input_5
    mode: text
    lambda: return {activity_names[5]};
    set_action:
      lambda: |-
        set_activity_name(5, x);
        id(activity_side_5).update();
        id(current_activity).update();

  - platform: template
    name: "Seite 6 Name"
    id: name_input_6
    mode: text
    lambda: return {activity_names[6]};
    set_action:
      lambda: |-
        set_activity_name(6, x);
        id(activity_side_6).update();
        id(current_activity).update();

# Tracking-Erinnerung & Zeitlimit (persistiert ueber Reboot)
number:
  # Kurzes Aufblinken alle X Minuten, solange getrackt wird (0 = aus)
  - platform: template
    name: "Erinnerung alle Minuten (0 = aus)"
    id: reminder_minutes
    min_value: 0
    max_value: 240
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 30

  # Fallback: nach X Stunden auf derselben Seite wird das Tracking automatisch beendet
  - platform: template
    name: "Max. Tracking Stunden (Min 1, Max 24)"
    id: max_tracking_hours
    min_value: 1
    max_value: 24
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 4

  # Helligkeit der blauen WLAN-Anzeige
  - platform: template
    name: "WLAN LED Helligkeit"
    id: wifi_led_brightness
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 20

# Global Variables
globals:
  - id: last_side
    type: int
    restore_value: no
    initial_value: '0'
  
  - id: pending_side
    type: int
    restore_value: no
    initial_value: '0'
  
  - id: debounce_start
    type: unsigned long
    restore_value: no
    initial_value: '0'
  
  - id: activity_start
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: activity_start_epoch
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: is_debouncing
    type: bool
    restore_value: no
    initial_value: 'false'
  
  - id: wifi_connected
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: wifi_ever_connected
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: wifi_user_enabled
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: green_flash_until
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: led_override_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: reminder_count
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: tracking_stopped
    type: bool
    restore_value: no
    initial_value: 'false'


# Scripts
script:
  - id: handle_side_change
    then:
      - lambda: |-
          int new_side = (int)id(current_side).state;
          
          // Kein Unterschied zur aktuell bestätigten Seite -> nichts zu tun
          if (new_side == id(last_side)) return;
          
          // Nur Timer (neu) starten, wenn wir noch nicht schon auf genau diese Seite debouncen
          if (!id(is_debouncing) || new_side != id(pending_side)) {
            id(pending_side) = new_side;
            id(debounce_start) = millis();
            id(is_debouncing) = true;
            ESP_LOGI("timecube", "Debounce started: %d -> %d", id(last_side), new_side);
          }

  # Wird alle 500ms vom interval aufgerufen, prüft ob Debounce abgelaufen ist
  - id: check_debounce
    then:
      - lambda: |-
          if (!id(is_debouncing)) return;
          
          int current = (int)id(current_side).state;
          
          // Seite hat sich während der Debounce-Zeit nochmal geändert
          if (current != id(pending_side)) {
            id(pending_side) = current;
            id(debounce_start) = millis();
            return;
          }
          
          // 2s stabil? -> bestätigen
          if (millis() - id(debounce_start) > 2000) {
            id(is_debouncing) = false;
            
            unsigned long duration = 0;
            if (id(activity_start) > 0) {
              duration = (millis() - id(activity_start)) / 1000;
              id(activity_duration).publish_state(duration);
              
              log_activity(id(last_side), duration);
              id(csv_export).update();
              id(log_count).update();
            }
            
            id(last_side) = current;
            id(green_flash_until) = millis() + 5000;
            id(activity_start) = millis();
            auto now = id(sntp_time).now();
            id(activity_start_epoch) = now.is_valid() ? (unsigned long)now.timestamp : 0;
            id(current_activity).update();

            id(reminder_count) = 0;
            id(tracking_stopped) = false;

            ESP_LOGI("timecube", "Side confirmed: %d (%s)", current, id(current_activity).state.c_str());
          }
  - id: update_led
    then:
      - lambda: |-
          ESP_LOGD("timecube", "update_led: wifi=%d debounce=%d green_until=%lu now=%lu", 
           id(wifi_connected), id(is_debouncing), id(green_flash_until), millis());
          
          if (id(led_override_active)) return;  // Reminder-Blinken läuft, nicht stören

          // WiFi per Taster abgeschaltet -> LED aus
          if (!id(wifi_user_enabled)) {
            id(status_led).turn_off().perform();
            return;
          }

          // WiFi nicht verbunden
          if (!id(wifi_connected)) {
            unsigned long period = id(wifi_ever_connected) ? 300 : 1000; // rot schnell / gelb langsam
            bool on_phase = (millis() % period) < (period / 2);
            auto call = id(status_led).turn_on();
            if (on_phase) {
              if (id(wifi_ever_connected)) call.set_rgb(1.0f, 0.0f, 0.0f);   // Rot
              else call.set_rgb(1.0f, 0.75f, 0.0f);                          // Gelb
              call.set_brightness(1.0f);
            } else {
              call.set_state(false);
            }
            call.perform();
            return;
          }

          // Seitenwechsel erkannt -> Grün, 5s an
          if (millis() < id(green_flash_until)) {
            auto call = id(status_led).turn_on();
            call.set_rgb(0.0f, 1.0f, 0.0f);
            call.set_brightness(1.0f);
            call.perform();
            return;
          }

          // Debounce läuft -> Weiß gedimmt
          if (id(is_debouncing)) {
            auto call = id(status_led).turn_on();
            call.set_rgb(1.0f, 1.0f, 1.0f);
            call.set_brightness(0.15f);
            call.perform();
            return;
          }

          // Tracking per Zeitlimit beendet -> gedimmtes Lila, bis gekippt wird
          if (id(tracking_stopped)) {
            auto call = id(status_led).turn_on();
            call.set_rgb(0.6f, 0.0f, 1.0f);
            call.set_brightness(0.15f);
            call.perform();
            return;
          }

          // Bereit, WiFi aktiv -> gedimmtes Blau
          auto call = id(status_led).turn_on();
          call.set_rgb(0.0f, 0.3f, 1.0f);
          call.set_brightness(id(wifi_led_brightness).state / 100.0f);
          call.perform();

  # Kurzes Aufblitzen in gegebener Farbe, ohne die normale LED-Logik zu stoeren
  - id: led_blink
    parameters:
      red: float
      green: float
      blue: float
    then:
      - lambda: 'id(led_override_active) = true;'
      - light.turn_on:
          id: status_led
          red: !lambda 'return red;'
          green: !lambda 'return green;'
          blue: !lambda 'return blue;'
          brightness: 100%
      - delay: 300ms
      - light.turn_off: status_led
      - lambda: 'id(led_override_active) = false;'

  # Alle 1s: freundliche Erinnerung, dass getrackt wird, und Zeitlimit als Fallback
  # (z.B. Wuerfel abends vergessen -> trackt nicht die ganze Nacht).
  - id: check_tracking
    then:
      - lambda: |-
          if (id(activity_start) == 0) return;  // nichts aktiv

          unsigned long elapsed = (millis() - id(activity_start)) / 1000;

          unsigned long max_sec = (unsigned long)(id(max_tracking_hours).state * 3600);
          if (elapsed >= max_sec) {
            id(activity_duration).publish_state(max_sec);
            log_activity(id(last_side), max_sec);
            id(csv_export).update();
            id(log_count).update();
            clear_checkpoint();
            id(activity_start) = 0;
            id(activity_start_epoch) = 0;
            id(tracking_stopped) = true;
            id(current_activity).publish_state("Gestoppt (Zeitlimit)");
            ESP_LOGW("timecube", "Zeitlimit erreicht: Seite %d nach %lu s automatisch beendet", id(last_side), max_sec);
            return;
          }

          unsigned long reminder_sec = (unsigned long)(id(reminder_minutes).state * 60);
          if (reminder_sec == 0) return;
          unsigned long due = elapsed / reminder_sec;
          if (due > id(reminder_count)) {
            id(reminder_count) = due;
            id(led_blink).execute(1.0f, 0.5f, 0.0f);  // Orange
          }

  - id: save_checkpoint_tick
    then:
      - lambda: |-
          if (id(activity_start) > 0 && id(last_side) >= 1 && id(last_side) <= 6) {
            save_checkpoint(id(last_side), id(activity_start_epoch));
          }

# Intervals
interval:
  - interval: 100ms
    then:
      - script.execute: update_led

  - interval: 500ms
    then:
      - script.execute: check_debounce

  - interval: 1s
    then:
      - script.execute: check_tracking

  - interval: 60s
    then:
      - script.execute: save_checkpoint_tick
