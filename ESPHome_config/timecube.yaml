esphome:
  name: timecube
  friendly_name: Time Cube
  includes:
    - timecube_storage.h
    - timecube_dashboard.h
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            ESP_LOGI("timecube", "Time Cube gestartet!");
            setup_littlefs();
            load_config();
            register_dashboard_handler();
            id(wifi_user_enabled) = true;
        - wifi.enable:

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  partitions: partitions_timecube.csv

# WiFi Configuration (keine hardcoded Credentials!)
wifi:
  ap:
    ssid: "TimeCube Setup"
    password: ""
  on_connect:
    then:
      - lambda: |-
          id(wifi_connected) = true;
          id(wifi_ever_connected) = true;
  on_disconnect:
    then:
      - lambda: |-
          id(wifi_connected) = false;

# Captive Portal für WiFi Setup
captive_portal:

# Improv Serial für USB-Setup über Browser
improv_serial:

# Enable logging
logger:
  level: INFO # DEBUG
  logs:
    mpu6050: INFO
    sensor: INFO
    web_server: INFO

api:
  services:
    # Namen ändern
    - service: set_activity_name
      variables:
        side: int
        name: string
      then:
        - lambda: |-
            set_activity_name(side, name);
            id(activity_side_1).update();
            id(activity_side_2).update();
            id(activity_side_3).update();
            id(activity_side_4).update();
            id(activity_side_5).update();
            id(activity_side_6).update();

    # CSV Export triggern
    - service: export_csv
      then:
        - lambda: |-
            id(csv_export).update();

    # Log löschen
    - service: clear_log
      then:
        - lambda: |-
            clear_log();
            id(csv_export).update();
            id(log_count).update();

# Web Server for Dashboard + WiFi Management
web_server_base:
  id: base_web_server

web_server:
  web_server_base_id: base_web_server
  port: 80
  version: 3
  local: true
  sorting_groups:
    - id: grp_aktuell
      name: "Aktuell"
      sorting_weight: 10
    - id: grp_seiten
      name: "Seitennamen"
      sorting_weight: 20
    - id: grp_tracking
      name: "Tracking"
      sorting_weight: 30
    - id: grp_pause
      name: "Pause"
      sorting_weight: 40
    - id: grp_wlan
      name: "WLAN"
      sorting_weight: 50
    - id: grp_daten
      name: "Daten"
      sorting_weight: 60
    - id: grp_system
      name: "System"
      sorting_weight: 70

# Time Component (NTP)
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    on_time_sync:
      then:
        - lambda: |-
            recover_checkpoint();

# I2C Bus for MPU-6050
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 100kHz

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    pin:
      number: 48
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    name: "Status LED"
    web_server:
      sorting_group_id: grp_aktuell
      sorting_weight: 4
    default_transition_length: 0s


# MPU-6050 Sensor
sensor:
  - platform: mpu6050
    address: 0x68
    update_interval: 200ms
    accel_x:
      name: "Accel X"
      id: accel_x
      internal: true
    accel_y:
      name: "Accel Y"
      id: accel_y
      internal: true
    accel_z:
      name: "Accel Z"
      id: accel_z
      internal: true

  - platform: wifi_signal
    name: "WiFi Signal"
    web_server:
      sorting_group_id: grp_wlan
      sorting_weight: 2
    update_interval: 60s

  - platform: template
    name: "Current Side"
    web_server:
      sorting_group_id: grp_aktuell
      sorting_weight: 2
    id: current_side
    update_interval: 3s
    lambda: |-
      float x = id(accel_x).state;
      float y = id(accel_y).state;
      float z = id(accel_z).state;

      if (z > 8.0) return 1;
      if (z < -8.0) return 2;
      if (y > 8.0) return 3;
      if (y < -8.0) return 4;
      if (x > 8.0) return 5;
      if (x < -8.0) return 6;

      // Keine Achse eindeutig (z.B. auf einer Ecke im Halter) -> 0 = Pause
      if (fabsf(x) < 7.5f && fabsf(y) < 7.5f && fabsf(z) < 7.5f) return 0;

      return id(current_side).state;
    on_value:
      then:
        - script.execute: handle_side_change

  - platform: template
    name: "Activity Duration"
    web_server:
      sorting_group_id: grp_aktuell
      sorting_weight: 3
    id: activity_duration
    unit_of_measurement: "s"
    accuracy_decimals: 0

  - platform: template
    name: "Log Count"
    web_server:
      sorting_group_id: grp_daten
      sorting_weight: 2
    id: log_count
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      return get_log_count();

# Text Sensor for Activity Name
text_sensor:
  - platform: template
    name: "Current Activity"
    web_server:
      sorting_group_id: grp_aktuell
      sorting_weight: 1
    id: current_activity
    update_interval: never
    lambda: |-
      return get_activity_name(id(last_side));

  # CSV Export
  - platform: template
    name: "CSV Export"
    web_server:
      sorting_group_id: grp_daten
      sorting_weight: 1
    id: csv_export
    update_interval: never
    lambda: |-
      return get_csv_content();

  # Seitennamen als Text Sensors
  - platform: template
    name: "Activity Side 1"
    id: activity_side_1
    internal: true
    update_interval: 60s
    lambda: |-
      return get_activity_name(1);

  - platform: template
    name: "Activity Side 2"
    id: activity_side_2
    internal: true
    update_interval: 60s
    lambda: |-
      return get_activity_name(2);

  - platform: template
    name: "Activity Side 3"
    id: activity_side_3
    internal: true
    update_interval: 60s
    lambda: |-
      return get_activity_name(3);

  - platform: template
    name: "Activity Side 4"
    id: activity_side_4
    internal: true
    update_interval: 60s
    lambda: |-
      return get_activity_name(4);

  - platform: template
    name: "Activity Side 5"
    id: activity_side_5
    internal: true
    update_interval: 60s
    lambda: |-
      return get_activity_name(5);

  - platform: template
    name: "Activity Side 6"
    id: activity_side_6
    internal: true
    update_interval: 60s
    lambda: |-
      return get_activity_name(6);

# Binary Sensor for WiFi Status
binary_sensor:
  - platform: status
    name: "Status"
    web_server:
      sorting_group_id: grp_wlan
      sorting_weight: 3

  # Taster gegen GND: Klick = Seite (re)aktivieren, Doppelklick = Pause, 3s halten = WLAN an/aus
  - platform: gpio
    pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Taster"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 3
    id: main_button
    filters:
      - delayed_on_off: 20ms
    on_state:
      - logger.log:
          level: INFO
          format: "Taster Zustand: %s"
          args: ['x ? "gedrueckt" : "losgelassen"']
    # Halten (>= 3s) schaltet WLAN um
    on_click:
      - min_length: 3000ms
        max_length: 60s
        then:
          - logger.log:
              level: INFO
              format: "Taster: Halten erkannt, WLAN umschalten"
          - lambda: 'id(wifi_user_enabled) = !id(wifi_user_enabled);'
          - if:
              condition:
                lambda: 'return id(wifi_user_enabled);'
              then:
                - wifi.enable:
              else:
                - wifi.disable:

    on_multi_click:
      # Klick: Tracking der Seite fortsetzen, auf der der Wuerfel liegt
      # (nach Zeitlimit-Stopp oder um eine Pause zu beenden)
      - timing:
          - ON for at most 1s
          - OFF for at least 400ms
        then:
          - lambda: |-
              bool on_break = id(last_side) == 0 && id(activity_start) > 0;
              if (!id(tracking_stopped) && !on_break) return;  // laeuft bereits normal

              float st = id(current_side).state;
              int phys = std::isnan(st) ? 0 : (int)st;
              if (phys < 1 || phys > 6) {
                // Liegt auf einer Ecke: gestoppte Pause wieder aufnehmen, sonst nichts zu tun
                if (id(tracking_stopped) && id(last_side) == 0) id(switch_to_side).execute(0);
                return;
              }
              id(is_debouncing) = false;
              id(break_hold_side) = 0;
              id(switch_to_side).execute(phys);
              ESP_LOGI("timecube", "Taster: Seite %d reaktiviert", phys);

      # Doppelklick: Pause starten, ohne den Wuerfel zu bewegen
      - timing:
          - ON for at most 1s
          - OFF for at most 300ms
          - ON for at most 1s
          - OFF for at least 400ms
        then:
          - lambda: |-
              if (id(last_side) == 0 && id(activity_start) > 0) return;  // schon in Pause
              // Physische Seite merken, damit sie die Pause nicht sofort wieder beendet
              id(break_hold_side) = id(last_side) > 0 ? id(last_side) : 0;
              id(is_debouncing) = false;
              id(switch_to_side).execute(0);
              id(break_lock_start) = millis();
              ESP_LOGI("timecube", "Taster: Pause per Doppelklick gestartet");

# Button to Reset WiFi
button:
  - platform: restart
    name: "Restart"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 1

  - platform: factory_reset
    name: "WiFi Reset (Factory Reset)"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 2
    id: wifi_reset_button

  - platform: template
    name: "CSV Aktualisieren"
    web_server:
      sorting_group_id: grp_daten
      sorting_weight: 3
    on_press:
      then:
        - lambda: |-
            id(csv_export).update();
            id(log_count).update();

  - platform: template
    name: "Log Loeschen"
    web_server:
      sorting_group_id: grp_daten
      sorting_weight: 4
    on_press:
      then:
        - lambda: |-
            clear_log();
            id(csv_export).update();
            id(log_count).update();

